name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: tsc + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Admin writes refresh the public site
        run: bash scripts/check-revalidate.sh

      # Missing translation keys fail the Typecheck step above (WHY-98 PR A).
      # TODO placeholders are expected; this only reports how many remain.
      - name: Georgian copy still TODO (report only)
        run: bash scripts/count-todo-copy.sh

      - name: Build
        run: npm run build
